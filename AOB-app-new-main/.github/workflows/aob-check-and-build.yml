name: AOB - Check Errors and Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  analyze:
    name: Find Dart/Flutter issues
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate project files
        run: |
          test -s pubspec.yaml
          test -d lib
          test -f lib/main.dart
          flutter --version
      - name: Download packages
        run: flutter pub get
      - name: Run analyzer and tests (save full report)
        shell: bash
        run: |
          mkdir -p ci-reports
          set +e
          flutter analyze lib test 2>&1 | tee ci-reports/flutter-analyze.txt
          ANALYZE_STATUS=${PIPESTATUS[0]}
          flutter test 2>&1 | tee ci-reports/flutter-test.txt
          TEST_STATUS=${PIPESTATUS[0]}
          {
            echo "Flutter analyze exit code: ${ANALYZE_STATUS}"
            echo "Flutter test exit code: ${TEST_STATUS}"
            if [ "$ANALYZE_STATUS" -eq 0 ] && [ "$TEST_STATUS" -eq 0 ]; then
              echo "Overall: PASS"
            else
              echo "Overall: ISSUES FOUND - read the two report files"
            fi
          } | tee ci-reports/summary.txt
          # Keep this job green so the report is always uploaded; report records failures.
      - name: Upload error reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AOB-error-reports
          path: ci-reports/
          if-no-files-found: warn
          retention-days: 14

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Download packages
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-Online-Bazaar-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
